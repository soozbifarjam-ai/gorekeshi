<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قرعه‌کشی اینستاگرام</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c451;--gold2:#ffe9a3;--pur:#8b3dff;--pur2:#c13584;--bg:#05030a;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--txt:#f4eefc;--mut:#a99cc4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#2a0f5c 0,transparent 55%),radial-gradient(ellipse at 90% 100%,#4a1238 0,transparent 50%),var(--bg);color:var(--txt);font-family:'Vazirmatn',Tahoma,sans-serif;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.wrap{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:18px 16px 40px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.btn-i{background:var(--glass);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(12px);transition:.25s}
.btn-i:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
header{text-align:center;margin:6px 0 18px}
.logo{width:74px;height:74px;margin:0 auto 10px;border-radius:22px;background:conic-gradient(from 200deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);display:grid;place-items:center;animation:spin 8s linear infinite;box-shadow:0 0 40px rgba(193,53,132,.55)}
.logo i{display:block;width:50px;height:50px;border-radius:15px;background:#0a0612;position:relative;animation:spin 8s linear infinite reverse}
.logo i:before{content:"";position:absolute;inset:12px;border:3px solid #fff;border-radius:50%}
.logo i:after{content:"";position:absolute;top:9px;right:9px;width:5px;height:5px;background:#fff;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(30px,7vw,58px);font-weight:900;line-height:1.3;background:linear-gradient(90deg,var(--gold2),var(--gold),#d88bff,var(--gold));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-300% 0}}
.badge{display:inline-flex;gap:10px;align-items:center;margin-top:10px;padding:10px 26px;border-radius:999px;border:1px solid rgba(245,196,81,.5);background:linear-gradient(135deg,rgba(139,61,255,.25),rgba(245,196,81,.15));font-weight:700;font-size:clamp(17px,3.6vw,26px);box-shadow:0 0 30px rgba(245,196,81,.2)}
.badge b{color:var(--gold)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}
.stats{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;margin-bottom:14px;font-size:15px}
.stats span{color:var(--mut)}.stats b{color:var(--gold);font-size:18px}
.prog{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:0 0 16px}
.prog div{height:100%;width:0;border-radius:99px;background:linear-gradient(270deg,var(--pur),var(--pur2),var(--gold));transition:width .9s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 16px var(--gold)}
#stage{position:relative;min-height:480px;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;opacity:0;visibility:hidden;transform:scale(.94);transition:.6s}
.scr.on{opacity:1;visibility:visible;transform:none}
#fin{overflow-y:auto;justify-content:flex-start}
.go{font:inherit;font-weight:900;font-size:clamp(20px,4.5vw,28px);color:#1a1000;border:0;cursor:pointer;padding:18px 54px;border-radius:999px;background:linear-gradient(135deg,var(--gold2),var(--gold) 50%,#e09a1a);box-shadow:0 0 0 0 rgba(245,196,81,.6),0 10px 40px rgba(245,196,81,.35);animation:pulse 2s infinite;transition:transform .2s}
.go:hover{transform:scale(1.06)}
@keyframes pulse{70%{box-shadow:0 0 0 24px rgba(245,196,81,0),0 10px 40px rgba(245,196,81,.35)}100%{box-shadow:0 0 0 0 rgba(245,196,81,0)}}
.hint{color:var(--mut);margin-top:16px;font-size:15px}
.cd{position:relative;width:min(70vw,300px);height:min(70vw,300px);display:grid;place-items:center}
.cd svg{position:absolute;inset:0;transform:rotate(-90deg)}
.cd circle{fill:none;stroke-width:6}
#ring{stroke:url(#g);stroke-linecap:round;stroke-dasharray:691;stroke-dashoffset:0;filter:drop-shadow(0 0 8px var(--gold))}
#num{font-size:clamp(100px,26vw,180px);font-weight:900;line-height:1;color:#fff;text-shadow:0 0 30px var(--pur),0 0 70px var(--gold)}
#num.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.7);opacity:0;filter:blur(8px)}30%{opacity:1;filter:none}100%{transform:scale(1)}}
.lbl{font-size:clamp(16px,3.5vw,22px);color:var(--gold2);margin-top:14px}
.roll{font-size:clamp(50px,13vw,96px);font-weight:900;color:var(--gold);text-shadow:0 0 30px var(--gold);font-variant-numeric:tabular-nums}
.wcard{position:relative;padding:28px 30px;border-radius:28px;border:1px solid rgba(245,196,81,.55);background:linear-gradient(160deg,rgba(139,61,255,.3),rgba(0,0,0,.4));box-shadow:0 0 60px rgba(139,61,255,.4);animation:reveal 1s cubic-bezier(.2,1.3,.3,1) both;min-width:min(88vw,420px)}
@keyframes reveal{0%{transform:scale(.2) rotateY(90deg);opacity:0;filter:blur(14px)}100%{transform:none;opacity:1}}
.av{width:96px;height:96px;margin:0 auto 12px;border-radius:50%;padding:4px;background:conic-gradient(#feda75,#d62976,#962fbf,#4f5bd5,#feda75);animation:spin 5s linear infinite}
.av span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#10091c;font:900 40px 'Vazirmatn',sans-serif;animation:spin 5s linear infinite reverse;color:#fff}
.rk{font-size:clamp(20px,4.5vw,28px);font-weight:700;color:var(--gold)}
.un{direction:ltr;unicode-bidi:isolate;font-family:'Vazirmatn',sans-serif;font-size:clamp(22px,6vw,40px);font-weight:900;margin-top:8px;word-break:break-all;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.grand{border-color:var(--gold);background:linear-gradient(160deg,rgba(245,196,81,.35),rgba(139,61,255,.3),rgba(0,0,0,.5));box-shadow:0 0 90px rgba(245,196,81,.7),0 0 160px rgba(139,61,255,.5)}
.gt{font-size:clamp(34px,9vw,64px);font-weight:900;background:linear-gradient(90deg,#fff6cf,var(--gold),#fff6cf,var(--gold));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.5s linear infinite;filter:drop-shadow(0 0 18px rgba(245,196,81,.9));margin-bottom:6px}
.crown{font-size:56px;animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
#strip{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.mini{padding:10px 16px;border-radius:16px;font-size:14px;animation:reveal .7s both;min-width:150px;text-align:center}
.mini small{display:block;color:var(--gold);font-size:12px}
.mini div{direction:ltr;unicode-bidi:isolate;font-weight:700;font-size:14px}
.res{display:grid;gap:10px;width:100%;max-width:560px;margin:12px 0}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.05);opacity:0;animation:reveal .7s forwards}
.row .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--pur),var(--pur2));flex:none}
.row.f{border-color:var(--gold);background:linear-gradient(90deg,rgba(245,196,81,.25),rgba(139,61,255,.15))}
.row.f .n{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1000}
.row .t{flex:1;text-align:right;font-size:14px;color:var(--mut)}
.row .u{direction:ltr;unicode-bidi:isolate;font-weight:700;font-size:clamp(15px,4vw,20px)}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.flash.f{animation:fl .8s}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:20px}
@media(max-width:560px){#stage{min-height:540px}.stats{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas><div class="flash" id="flash"></div>
<div class="wrap">
  <div class="bar">
    <button class="btn-i" id="mute">🔊 صدا روشن</button>
    <button class="btn-i" id="fs">⛶ تمام‌صفحه</button>
  </div>
  <header>
    <div class="logo"><i></i></div>
    <h1>قرعه‌کشی اینستاگرام</h1>
    <div class="badge">🎁 <b id="p4k">۱۵٬۸۲۳</b> شرکت‌کننده</div>
  <div class="hint" style="margin-top:8px;font-size:13px">نسخه نمایشی</div></header>
  <div class="glass stats">
    <div><span>شرکت‌کنندگان بررسی‌شده: </span><b id="chk">۰</b></div>
    <div><span>برندگان اعلام‌شده: </span><b id="wc">۰/۵</b></div>
  </div>
  <div class="prog"><div id="pb"></div></div>
  <div class="glass" id="stage">
    <section class="scr on" id="s0">
      <div style="font-size:64px;margin-bottom:6px">✨</div>
      <p class="hint" style="margin:0 0 22px;font-size:18px">پنج برنده از میان ۱۵٬۸۲۳ شرکت‌کننده اعلام می‌شوند</p>
      <button class="go" id="start">شروع قرعه‌کشی</button>
      <p class="hint">با هر کلیک، یک برنده با شمارش معکوس ۵ ثانیه‌ای اعلام می‌شود</p>
    </section>
    <section class="scr" id="s1">
      <div class="cd">
        <svg viewBox="0 0 240 240"><defs><linearGradient id="g"><stop offset="0" stop-color="#8b3dff"/><stop offset="1" stop-color="#f5c451"/></linearGradient></defs><circle cx="120" cy="120" r="110" stroke="rgba(255,255,255,.1)"/><circle id="ring" cx="120" cy="120" r="110"/></svg>
        <div id="num">۱۰</div>
      </div>
      <div class="lbl">قرعه‌کشی در حال آماده‌سازی است…</div>
    </section>
    <section class="scr" id="s2"></section>
    <section class="scr" id="fin">
      <div class="gt" style="font-size:clamp(26px,6vw,44px)">🏆 نتایج نهایی</div>
      <div class="res" id="res"></div>
      <button class="go" id="replay" style="font-size:20px;padding:14px 40px;animation:none">↻ پخش مجدد</button>
    </section>
  </div>
  <div id="strip"></div>
  <footer>نسخه نمایشی</footer>
</div>
<script>
(function(){
'use strict';
const WINNERS=Object.freeze([
 {r:5,u:'@narges.moradiam',t:'نفر پنجم'},
 {r:4,u:'@Mobina.farshi20',t:'نفر چهارم'},
 {r:3,u:'@shayankhani032',t:'نفر سوم'},
 {r:2,u:'@nastaran_4405',t:'نفر دوم'},
 {r:1,u:'@alireza_niazi299',t:'مقام اول'}
]);
const TOTAL=15823,fa=n=>Number(n).toLocaleString('fa-IR'),$=id=>document.getElementById(id);
let run=0,muted=false,ac=null,idx=0;

/* ---------- Sound ---------- */
function tone(f,d,type,v,delay){
  if(muted||!ac)return;
  const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05);
}
const sfx={
  tick:n=>tone(300+(10-n)*45,.25,'triangle',.14),
  whoosh:()=>{tone(180,.6,'sawtooth',.05);tone(420,.5,'sine',.06,.1)},
  roll:()=>tone(900+Math.random()*300,.05,'square',.03),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.5,'triangle',.14,i*.1)),
  grand:()=>{[392,523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.9,'triangle',.15,i*.12));[261,329,392].forEach(f=>tone(f,2,'sine',.12,.9))},
  boom:()=>{tone(90,.5,'sine',.25);tone(60,.7,'sine',.2)}
};

/* ---------- Particles ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let P=[],W,H,intense=0;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',size);size();
const COLS=['#f5c451','#ffe9a3','#8b3dff','#c13584','#feda75','#fff'];
function burst(x,y,n,cols){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=2+Math.random()*6;
    P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.07,life:1,dec:.008+Math.random()*.01,c:cols?cols[i%cols.length]:COLS[i%COLS.length],s:2+Math.random()*2.5,t:0})}
}
function confetti(n){
  for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:-20,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,g:.03,life:1,dec:.003,c:COLS[i%COLS.length],s:5+Math.random()*5,t:1,rot:Math.random()*6})
}
for(let i=0;i<70;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.3,vy:-.2-Math.random()*.5,g:0,life:1,dec:0,c:COLS[i%3],s:1+Math.random()*2,t:2});
function loop(){
  cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life-=p.dec;
    if(p.t===2){if(p.y<-5){p.y=H+5;p.x=Math.random()*W}cx.globalAlpha=.25+intense*.4}
    else{cx.globalAlpha=Math.max(p.life,0);if(p.life<=0||p.y>H+30){P.splice(i,1);continue}}
    cx.fillStyle=p.c;
    if(p.t===1){p.rot+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
    else{cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill()}
  }
  requestAnimationFrame(loop)
}
loop();
function fireworks(ms,id){
  const end=performance.now()+ms;
  (function f(){
    if(run!==id||performance.now()>end)return;
    burst(W*(.15+Math.random()*.7),H*(.12+Math.random()*.4),60);sfx.boom();
    setTimeout(f,350+Math.random()*350)
  })()
}

/* ---------- Helpers ---------- */
const wait=(ms,id)=>new Promise(r=>setTimeout(()=>r(id===run),ms));
function show(id){['s0','s1','s2','fin'].forEach(s=>$(s).classList.toggle('on',s===id))}
function flash(){const f=$('flash');f.classList.remove('f');void f.offsetWidth;f.classList.add('f')}
function setProg(n){$('pb').style.width=(n/5*100)+'%';$('wc').textContent=fa(n)+'/'+fa(5)}
function reset(){
  P=P.filter(p=>p.t===2);$('strip').innerHTML='';$('res').innerHTML='';
  setProg(0);$('chk').textContent=fa(0);$('ring').style.strokeDashoffset=0;intense=0;
}

/* ---------- Draw flow ---------- */
async function countdown(id,S){
  show('s1');const num=$('num'),ring=$('ring'),t0=performance.now();let last=0;
  sfx.whoosh();
  return new Promise(res=>{
    (function step(now){
      if(run!==id)return res(false);
      const el=Math.min(now-t0,S),n=Math.ceil((S-el)/1000);
      if(idx===0)$('chk').textContent=fa(Math.floor(el/S*TOTAL));
      ring.style.strokeDashoffset=691*(el/S);
      intense=el/S;
      if(n!==last&&el<10000){last=n;num.textContent=fa(n);num.classList.remove('pop');void num.offsetWidth;num.classList.add('pop');sfx.tick(n);
        burst(W/2,H/2,n<=3?28:12,['#8b3dff','#f5c451'])}
      if(el>=S){$('chk').textContent=fa(TOTAL);return res(true)}
      requestAnimationFrame(step)
    })(performance.now())
  })
}
async function reveal(w,i,id){
  const s=$('s2'),grand=w.r===1;
  s.innerHTML='<div class="lbl" style="margin:0 0 10px;font-size:clamp(20px,4.5vw,30px)">'+(grand?'انتخاب مقام اول…':'انتخاب '+w.t+'…')+'</div><div class="roll" id="roll">۰۰۰۰</div>';
  show('s2');sfx.whoosh();
  const rl=$('roll'),dur=grand?3200:2000,t0=performance.now();
  while(performance.now()-t0<dur){
    if(run!==id)return false;
    rl.textContent=fa(String(1+Math.floor(Math.random()*TOTAL)).padStart(4,'0').replace(/^0+(?=\d)/,'')).replace(/٬/g,'');
    sfx.roll();await wait(70,id)
  }
  if(run!==id)return false;
  flash();
  s.innerHTML='';
  const c=document.createElement('div');c.className='wcard'+(grand?' grand':'');
  c.innerHTML=(grand?'<div class="crown">👑</div><div class="gt">مقام اول</div>':'')+
   '<div class="av"><span>'+w.u.charAt(1).toUpperCase()+'</span></div>'+
   '<div class="rk">'+(grand?'':'مقام '+w.t.replace('نفر ',''))+' 🏅</div><div class="un"></div>';
  c.querySelector('.un').textContent=w.u;
  s.appendChild(c);
  burst(W/2,H/2,grand?140:70);
  if(grand){sfx.grand();confetti(260);fireworks(6500,id);setTimeout(()=>run===id&&confetti(200),2500)}
  else{sfx.win();confetti(60)}
  setProg(i+1);
  const m=document.createElement('div');m.className='glass mini';
  m.innerHTML='<small>'+(grand?'مقام اول':'مقام '+w.t.replace('نفر ',''))+'</small><div></div>';
  m.querySelector('div').textContent=w.u;
  $('strip').prepend(m);
  const nb=document.createElement('button');nb.className='go';nb.style.cssText='margin-top:22px;font-size:18px;padding:12px 34px;animation:none';
  nb.textContent=grand?'مشاهده نتایج نهایی':'اعلام نفر بعدی';
  nb.onclick=()=>{if(run!==id)return;if(grand)finale();else{idx++;next(id)}};
  s.appendChild(nb);return true;
}
function finale(){
  show('fin');const res=$('res');res.innerHTML='';
  [...WINNERS].reverse().forEach((w,k)=>{
    const r=document.createElement('div');r.className='row'+(w.r===1?' f':'');r.style.animationDelay=(k*.15)+'s';
    r.innerHTML='<div class="n">'+fa(w.r)+'</div><div class="u"></div><div class="t">'+(w.r===1?'👑 مقام اول':w.t)+'</div>';
    r.querySelector('.u').textContent=w.u;res.appendChild(r)
  });
  $('strip').innerHTML='';
  burst(W/2,H/3,100)
}
async function start(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
  const id=++run;reset();
  idx=0;next(id)
}
async function next(id){
  if(!await countdown(id,5000))return;
  await reveal(WINNERS[idx],idx,id)
}

/* ---------- Controls ---------- */
$('start').onclick=start;
$('replay').onclick=start;
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇 صدا خاموش':'🔊 صدا روشن'};
$('fs').onclick=function(){
  try{
    if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(e){}
};
document.addEventListener('fullscreenchange',()=>{$('fs').textContent=document.fullscreenElement?'✕ خروج از تمام‌صفحه':'⛶ تمام‌صفحه'});
$('p4k').textContent=fa(TOTAL);
})();
</script>
</body>
</html>
